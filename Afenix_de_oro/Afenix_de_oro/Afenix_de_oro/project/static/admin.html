<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f8f9fa; }
    .section-card { margin-bottom: 1.5rem; }
    .section-title { margin-bottom: 1rem; }
    .small-text { font-size: 0.9rem; color: #6c757d; }
    .response-message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3">Panel de Administrador</h1>
        <p class="small-text" id="adminInfo">Verificando sesión...</p>
      </div>
      <button id="logoutBtn" class="btn btn-outline-danger">Cerrar sesión</button>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="h5 section-title">Crear usuario</h2>
        <form id="createUserForm">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Usuario</label>
              <input type="text" id="userUsername" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Rol</label>
              <select id="userRole" class="form-select" required>
                <option value="CAMARERO">Camarero</option>
                <option value="COCINERO">Cocinero</option>
                <option value="ADMIN">Administrador</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre completo</label>
              <input type="text" id="userFullName" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Teléfono</label>
              <input type="text" id="userPhone" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Contraseña</label>
              <input type="password" id="userPassword" class="form-control" required minlength="8" />
            </div>
          </div>
          <div class="mt-3 d-flex gap-2 align-items-center">
            <button class="btn btn-primary" type="submit">Crear usuario</button>
            <span class="response-message text-success" id="userResponse"></span>
          </div>
        </form>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="h5 section-title">Crear mesa</h2>
        <form id="createTableForm">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Número de mesa</label>
              <input type="number" id="tableNumber" class="form-control" required min="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Capacidad</label>
              <input type="number" id="tableCapacity" class="form-control" required min="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Ubicación</label>
              <input type="text" id="tableLocation" class="form-control" />
            </div>
          </div>
          <div class="mt-3 d-flex gap-2 align-items-center">
            <button class="btn btn-primary" type="submit">Crear mesa</button>
            <span class="response-message text-success" id="tableResponse"></span>
          </div>
        </form>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="h5 section-title">Mesas existentes</h2>
        <div class="mb-3">
          <button id="refreshTablesBtn" class="btn btn-outline-secondary btn-sm">Actualizar mesas</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped" id="tablesTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Número</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th>Ubicación</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="h5 section-title">Crear plato</h2>
        <form id="createDishForm">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Nombre</label>
              <input type="text" id="dishName" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Categoría</label>
              <input type="text" id="dishCategory" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Precio (centavos)</label>
              <input type="number" id="dishPrice" class="form-control" required min="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Tiempo estimado (segundos)</label>
              <input type="number" id="dishTime" class="form-control" required min="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Disponible</label>
              <select id="dishAvailable" class="form-select">
                <option value="true">Sí</option>
                <option value="false">No</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Notas de preparación</label>
              <input type="text" id="dishNotes" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea id="dishDescription" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="mt-3 d-flex gap-2 align-items-center">
            <button class="btn btn-primary" type="submit">Crear plato</button>
            <span class="response-message text-success" id="dishResponse"></span>
          </div>
        </form>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="h5 section-title">Usuarios registrados</h2>
        <div class="mb-3">
          <button id="refreshUsersBtn" class="btn btn-outline-secondary btn-sm">Actualizar lista</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped" id="usersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Activo</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiBase = "/api/v1";
    const token = localStorage.getItem("access_token");
    const headers = {
      "Content-Type": "application/json",
      Authorization: token ? `Bearer ${token}` : "",
    };

    function redirectToLogin() {
      localStorage.removeItem("access_token");
      window.location.href = "/";
    }

    async function fetchMe() {
      if (!token) return redirectToLogin();
      try {
        const response = await fetch(`${apiBase}/users/me`, { headers });
        const body = await response.json();
        if (!response.ok || body.data.role !== "ADMIN") {
          return redirectToLogin();
        }
        // Prefer display_name stored in localStorage (set at login), otherwise build from server data
        const storedDisplay = localStorage.getItem("display_name");
        const roleCodeMap = { ADMIN: "AD", CAMARERO: "ME", COCINERO: "CO" };
        const builtDisplay = `${body.data.username}_${roleCodeMap[body.data.role] || body.data.role.slice(0,2).toUpperCase()}`;
        document.getElementById("adminInfo").innerText = `Sesión iniciada como ${storedDisplay || builtDisplay}`;
      } catch (error) {
        redirectToLogin();
      }
    }

    async function handleFormSubmit(formId, endpoint, formData, responseId, successMessage) {
      try {
        const response = await fetch(`${apiBase}/${endpoint}`, {
          method: "POST",
          headers,
          body: JSON.stringify(formData),
        });
        const body = await response.json();
        const responseEl = document.getElementById(responseId);
        if (!response.ok) {
          responseEl.classList.remove("text-success");
          responseEl.classList.add("text-danger");
          responseEl.innerText = body.detail || body.message || "Error al crear.";
          return;
        }
        responseEl.classList.remove("text-danger");
        responseEl.classList.add("text-success");
        responseEl.innerText = successMessage;
        return body;
      } catch (error) {
        const responseEl = document.getElementById(responseId);
        responseEl.classList.remove("text-success");
        responseEl.classList.add("text-danger");
        responseEl.innerText = "No se pudo conectar con la API.";
      }
    }

    async function createUser(event) {
      event.preventDefault();
      const formData = {
        username: document.getElementById("userUsername").value.trim(),
        password: document.getElementById("userPassword").value,
        full_name: document.getElementById("userFullName").value.trim(),
        role: document.getElementById("userRole").value,
        phone: document.getElementById("userPhone").value.trim() || null,
      };
      const result = await handleFormSubmit("createUserForm", "users/register", formData, "userResponse", "Usuario creado correctamente.");
      if (result) {
        document.getElementById("createUserForm").reset();
        loadUsers();
      }
    }

    async function createTable(event) {
      event.preventDefault();
      const formData = {
        table_number: Number(document.getElementById("tableNumber").value),
        capacity: Number(document.getElementById("tableCapacity").value),
        location: document.getElementById("tableLocation").value.trim() || null,
      };
      const result = await handleFormSubmit("createTableForm", "tables", formData, "tableResponse", "Mesa creada correctamente.");
      if (result) {
        document.getElementById("createTableForm").reset();
        await loadTables();
      }
    }

    async function createDish(event) {
      event.preventDefault();
      const formData = {
        name: document.getElementById("dishName").value.trim(),
        description: document.getElementById("dishDescription").value.trim() || null,
        price: Number(document.getElementById("dishPrice").value),
        estimated_time: Number(document.getElementById("dishTime").value),
        category: document.getElementById("dishCategory").value.trim(),
        is_available: document.getElementById("dishAvailable").value === "true",
        preparation_notes: document.getElementById("dishNotes").value.trim() || null,
      };
      await handleFormSubmit("createDishForm", "dishes", formData, "dishResponse", "Plato creado correctamente.");
      document.getElementById("createDishForm").reset();
    }

    async function loadUsers() {
      try {
        const response = await fetch(`${apiBase}/users?skip=0&limit=20`, { headers });
        const body = await response.json();
        const tbody = document.querySelector("#usersTable tbody");
        tbody.innerHTML = "";
        if (response.ok) {
          body.data.forEach(user => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${user.id}</td><td>${user.username}</td><td>${user.role}</td><td>${user.is_active ? 'Sí' : 'No'}</td>`;
            tbody.appendChild(row);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="text-danger">${body.detail || body.message || 'No se pudo cargar la lista.'}</td></tr>`;
        }
      } catch (error) {
        const tbody = document.querySelector("#usersTable tbody");
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger">No se pudo conectar con la API.</td></tr>`;
      }
    }

    async function loadTables() {
      try {
        const response = await fetch(`${apiBase}/tables?skip=0&limit=50`, { headers });
        const body = await response.json();
        const tbody = document.querySelector("#tablesTable tbody");
        tbody.innerHTML = "";
        if (response.ok) {
          body.data.forEach(table => {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${table.id}</td><td>${table.table_number}</td><td>${table.capacity}</td><td>${table.status}</td><td>${table.location || ''}</td>`;
            tbody.appendChild(row);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="5" class="text-danger">${body.detail || body.message || 'No se pudo cargar la lista de mesas.'}</td></tr>`;
        }
      } catch (error) {
        const tbody = document.querySelector("#tablesTable tbody");
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger">No se pudo conectar con la API.</td></tr>`;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", redirectToLogin);
    document.getElementById("createUserForm").addEventListener("submit", createUser);
    document.getElementById("createTableForm").addEventListener("submit", createTable);
    document.getElementById("createDishForm").addEventListener("submit", createDish);
    document.getElementById("refreshUsersBtn").addEventListener("click", loadUsers);
    document.getElementById("refreshTablesBtn").addEventListener("click", loadTables);

    window.addEventListener("load", async () => {
      await fetchMe();
      await loadUsers();
      await loadTables();
    });
  </script>
</body>
</html>
