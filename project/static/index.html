<!doctype html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .btn-login {
      background-color: #c45c4f;
      border: none;
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background-color: #a94a3f;
      transform: scale(1.02);
    }
  </style>
</head>
<body class="bg-body-secondary">
  <div class="modal modal-sheet position-static d-block p-4 py-md-5">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 shadow">
        <div class="modal-header p-5 pb-4 border-bottom-0">
          <h1 class="fw-bold mb-0 fs-2">Ingresa aquí</h1>
        </div>
        <div class="modal-body p-5 pt-0">
          <form id="loginForm">
            <div class="form-floating mb-3">
              <input type="text" class="form-control rounded-3" id="floatingInput" placeholder="Usuario" required />
              <label for="floatingInput">Usuario</label>
            </div>
            <div class="mb-3">
              <label for="loginRole" class="form-label">Rol</label>
              <select id="loginRole" class="form-select rounded-3" required>
                <option value="CAMARERO">Camarero</option>
                <option value="COCINERO">Cocinero</option>
                <option value="ADMIN">Administrador</option>
              </select>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Password" required />
              <label for="floatingPassword">Contraseña</label>
            </div>
            <div class="mb-3">
              <button type="button" class="w-100 mb-2 btn btn-lg rounded-3 btn-login" id="regenerarBtn">
                Regenerar contraseña
              </button>
            </div>
            <p id="contadorDias" class="text-muted small"></p>
            <p id="nuevaPass" class="fw-bold"></p>
            <button class="w-100 mb-2 btn btn-lg rounded-3 btn-login" type="submit">
              Ingresar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiBase = "http://localhost:8000";
    function generarContrasena(usuario) {
      const hoy = new Date();
      const inicio = new Date("2024-01-01");
      const dias = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
      const periodo = Math.floor(dias / 14);
      return usuario + "_" + periodo;
    }
    function actualizarContador() {
      const fechaGuardada = localStorage.getItem("fechaPassword");
      if (!fechaGuardada) return;
      const hoy = new Date();
      const inicio = new Date(fechaGuardada);
      const diasPasados = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
      const restantes = 14 - diasPasados;
      document.getElementById("contadorDias").innerText =
        restantes > 0
          ? "Faltan " + restantes + " días para cambiar la contraseña"
          : "Ya puedes regenerar tu contraseña";
    }
    async function regenerarPassword() {
      const usuario = document.getElementById("floatingInput").value.trim().toLowerCase();
      if (!usuario) {
        alert("Ingresa tu usuario primero");
        return;
      }
      const hoy = new Date();
      const fechaGuardada = localStorage.getItem("fechaPassword");
      if (fechaGuardada) {
        const inicio = new Date(fechaGuardada);
        const diasPasados = Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
        if (diasPasados < 14) {
          alert("Aún no han pasado los 14 días");
          return;
        }
      }
      const nueva = generarContrasena(usuario);
      localStorage.setItem("password", nueva);
      localStorage.setItem("fechaPassword", hoy.toISOString());
      document.getElementById("nuevaPass").innerText = "Tu nueva contraseña es: " + nueva;
      actualizarContador();
    }
    async function login(event) {
      event.preventDefault();
      const usuario = document.getElementById("floatingInput").value.trim().toLowerCase();
      const password = document.getElementById("floatingPassword").value;
      if (usuario.length < 3) {
        alert("Usuario muy corto (mínimo 3 letras)");
        return;
      }
      const role = document.getElementById("loginRole").value;
      const loginPayload = { username: usuario, password, role };
      try {
        const response = await fetch(`${apiBase}/api/v1/users/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginPayload),
        });
        const data = await response.json();
        if (!response.ok) {
          alert(data.detail || data.message || "Error en autenticación");
          return;
        }
        const token = data.data.access_token;
        const displayFromApi = data.data.display_name;
        localStorage.setItem("access_token", token);
        if (displayFromApi) {
          localStorage.setItem("display_name", displayFromApi);
        }

        const meResponse = await fetch(`${apiBase}/api/v1/users/me`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
        });
        const meData = await meResponse.json();
        if (!meResponse.ok) {
          alert(meData.detail || meData.message || "No se pudo verificar el usuario");
          return;
        }

        const role = meData.data.role;
        const usernameFromMe = meData.data.username;
        const roleCode = role === "ADMIN" ? "AD" : (role === "CAMARERO" ? "ME" : (role === "COCINERO" ? "CO" : "US"));
        const displayName = displayFromApi || `${usernameFromMe}_${roleCode}`;
        localStorage.setItem("display_name", displayName);

        if (role === "ADMIN") {
          window.location.href = "/static/admin.html";
        } else if (role === "CAMARERO") {
          window.location.href = "/static/mesero.html";
        } else {
          alert("Rol no soportado aún: " + role);
        }
      } catch (error) {
        alert("No se pudo conectar con la API. Asegúrate de que FastAPI esté corriendo en localhost:8000");
      }
    }
    document.getElementById("regenerarBtn").addEventListener("click", regenerarPassword);
    document.getElementById("loginForm").addEventListener("submit", login);
    window.onload = actualizarContador;
  </script>
</body>
</html>
