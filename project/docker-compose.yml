version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: afenix_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: proyecto_afenix
    ports:
      - "3307:3306"
    volumes:
      - afenix_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: afenix_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: "123456"
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  afenix_mysql_data:
    driver: local
